name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: build
        run: make build
      - name: fixtures
        run: make fixtures
      - name: report
        run: make report
      - name: self-check
        run: make test
